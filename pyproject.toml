[project]
name = "infinite-reader"
version = "0.1.0"
description = "Infinite Book Reader API & Web UI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate==1.12.0",
    "chromadb==1.4.0",
    "coqui-tts==0.27.3",
    "datasets==4.5.0",
    "deepfilternet==0.5.6",
    "f5-tts==1.1.15",
    "fastapi==0.128.0",
    "gradio==6.5.1",
    "jinja2==3.1.6",
    "librosa==0.11.0",
    "num2words==0.5.14",
    "numpy==1.26.4",
    "nvidia-ml-py==13.590.44",
    "ollama==0.6.1",
    "pandas==3.0.0",
    "piper-tts==1.3.0",
    "psutil==7.2.1",
    "pydantic-settings==2.12.0",
    "pydub==0.25.1",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.22",
    "ruaccent==1.5.8.3",
    "soundfile==0.13.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.1",
    "transformers==4.57.6",
    "uvicorn==0.40.0",
    "vocos==0.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "E402", "E722", "F403", "F405", "F841"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
